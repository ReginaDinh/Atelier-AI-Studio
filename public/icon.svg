<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161927" />
      <stop offset="45%" stop-color="#0e111a" />
      <stop offset="100%" stop-color="#07080d" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.35" />
    </linearGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.38" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="75%" stop-color="#8b5cf6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="beamA" x1="12" y1="52" x2="32" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="35%" stop-color="#4f46e5" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="beamB" x1="32" y1="8" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0e7ff" />
      <stop offset="25%" stop-color="#c084fc" />
      <stop offset="65%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>

    <linearGradient id="bridgeC" x1="18" y1="36" x2="46" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <radialGradient id="sparkAperture" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#bae6fd" />
      <stop offset="80%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />

  <rect x="12" y="12" width="488" height="488" rx="110" fill="none" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Subtle Specular Reflection Top Highlight -->
  <path d="M 64 0 L 448 0 C 490 0 512 64 512 64 L 0 64 Z" fill="white" opacity="0.04" />

  <!-- Ambient Backdrop Core Glow -->
  <circle cx="256" cy="256" r="190" fill="url(#ambientGlow)" />

  <!-- Atelier Möbius Prism "A" Glyph -->
  <g transform="translate(44.80000000000001, 44.80000000000001) scale(6.6)">
    <!-- Left Ascending Beam -->
    <path
      d="M32 10L14 52H23.5L28.5 39H35.5L32 29L32 10Z"
      fill="url(#beamA)"
    />

    <!-- Right Descending Folded Facet -->
    <path
      d="M32 10L50 52H40.5L35.5 39H28.5L32 29L32 10Z"
      fill="url(#beamB)"
    />

    <!-- Balanced Optical Möbius Transverse Bridge -->
    <path
      d="M19 38.5H45L42.5 33.5H21.5L19 38.5Z"
      fill="url(#bridgeC)"
      opacity="0.96"
    />

    <!-- Optical Refraction Diamond Aperture inside Center -->
    <path
      d="M32 19L35.5 27L32 35L28.5 27Z"
      fill="url(#sparkAperture)"
    />

    <!-- Center Core Spark Star -->
    <path
      d="M32 23C32.1 25.5 33.5 26.9 36 27C33.5 27.1 32.1 28.5 32 31C31.9 28.5 30.5 27.1 28 27C30.5 26.9 31.9 25.5 32 23Z"
      fill="#ffffff"
    />

    <!-- Specular Apex Node -->
    <circle cx="32" cy="10" r="2.2" fill="#ffffff" />
  </g>
</svg>